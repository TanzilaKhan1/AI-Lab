[project]
name = "dhaka-search"
version = "0.1.0"
description = "Search algorithms on a Dhaka OSM road graph with synthetic risk."
authors = [{ name = "nasrin" }]
requires-python = ">=3.10,<4.0"
dependencies = [
    "osmnx (>=1.9,<3.0)",
    "networkx (>=3.2)",
    "numpy (>=1.26)",
    "matplotlib (>=3.8)",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
