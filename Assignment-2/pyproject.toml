[project]
name = "dhaka-fuel-csp"
version = "0.1.0"
description = "Dhaka fuel allocation CSP/COP — Bangladesh 2026 fuel crisis"
authors = [
    {name = "nasrin"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "osmnx (>=2.0,<3.0)",
    "geopandas (>=1.0,<2.0)",
    "shapely (>=2.0,<3.0)",
    "networkx (>=3.2,<4.0)",
    "matplotlib (>=3.8,<4.0)",
    "pandas (>=2.2,<3.0)",
    "numpy (>=1.26,<3.0)",
    "scipy (>=1.11,<2.0)",
    "jupyter (>=1.0,<2.0)",
    "notebook (>=7.0,<8.0)",
    "contextily (>=1.5,<2.0)",
    "folium (>=0.16,<1.0)",
    "seaborn (>=0.13,<1.0)",
    "tqdm (>=4.66,<5.0)",
    "plotly (>=6.7.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
